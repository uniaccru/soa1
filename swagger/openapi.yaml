openapi: 3.0.3
info:
  title: Dragon Collection API
  description: API управления коллекцией объектов Dragon и API убийц драконов. Все данные передаются в формате XML.
  version: 1.0.0
tags:
- name: dragons
  description: Основные операции с коллекцией драконов
- name: dragons-extra
  description: Дополнительные операции над коллекцией драконов
- name: killer
  description: Операции сервиса убийц драконов
paths:
  /dragons:
    post:
      tags:
      - dragons
      summary: Добавить элемент
      description: Добавляет новый объект Dragon в коллекцию. Поля id и creationDate генерируются автоматически.
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/DragonInput'
      responses:
        '201':
          description: Элемент создан
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Dragon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EndpointNotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502': &id001
          $ref: '#/components/responses/BadGateway'
        '503': &id002
          $ref: '#/components/responses/ServiceUnavailable'
        '504': &id003
          $ref: '#/components/responses/GatewayTimeout'
    get:
      tags:
      - dragons
      summary: Получить массив элементов
      description: Возвращает элементы коллекции с постраничным выводом. Поддерживает сортировку по одному полю и фильтрацию по любой комбинации полей (условия объединяются по И).
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      - $ref: '#/components/parameters/SortByParam'
      - $ref: '#/components/parameters/SortOrderParam'
      - $ref: '#/components/parameters/FilterId'
      - $ref: '#/components/parameters/FilterName'
      - $ref: '#/components/parameters/FilterX'
      - $ref: '#/components/parameters/FilterY'
      - $ref: '#/components/parameters/FilterCreationDate'
      - $ref: '#/components/parameters/FilterAge'
      - $ref: '#/components/parameters/FilterDescription'
      - $ref: '#/components/parameters/FilterWeight'
      - $ref: '#/components/parameters/FilterColor'
      - $ref: '#/components/parameters/FilterKillerName'
      - $ref: '#/components/parameters/FilterKillerHeight'
      - $ref: '#/components/parameters/FilterKillerEyeColor'
      - $ref: '#/components/parameters/FilterKillerHairColor'
      responses:
        '200':
          description: Массив элементов
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/DragonArray'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EndpointNotFound'
        '502': *id001
        '503': *id002
        '504': *id003
  /dragons/{id}:
    parameters:
    - $ref: '#/components/parameters/IdParam'
    get:
      tags:
      - dragons
      summary: Получить элемент по ID
      description: Возвращает объект Dragon с указанным id.
      responses:
        '200':
          description: Найденный элемент
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Dragon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502': *id001
        '503': *id002
        '504': *id003
    put:
      tags:
      - dragons
      summary: Обновить элемент
      description: Обновляет объект Dragon с указанным id.
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/DragonInput'
      responses:
        '200':
          description: Обновлённый элемент
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Dragon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502': *id001
        '503': *id002
        '504': *id003
    delete:
      tags:
      - dragons
      summary: Удалить элемент
      description: Удаляет объект Dragon с указанным id.
      responses:
        '204':
          description: Элемент удалён
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502': *id001
        '503': *id002
        '504': *id003
  /dragons/by-weight/{weight}:
    delete:
      tags:
      - dragons-extra
      summary: Удалить все объекты с заданным weight
      description: Удаляет все объекты коллекции, у которых значение поля weight равно указанному.
      parameters:
      - name: weight
        in: path
        required: true
        schema:
          type: integer
          format: int32
          exclusiveMinimum: true
          minimum: 0
      responses:
        '204':
          description: Объекты удалены (если найдены)
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EndpointNotFound'
        '502': *id001
        '503': *id002
        '504': *id003
  /dragons/average-age:
    get:
      tags:
      - dragons-extra
      summary: Среднее значение age
      description: Возвращает среднее значение поля age по всем объектам коллекции.
      responses:
        '200':
          description: Среднее значение
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AverageAge'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EndpointNotFound'
        '502': *id001
        '503': *id002
        '504': *id003
  /dragons/unique-descriptions:
    get:
      tags:
      - dragons-extra
      summary: Уникальные значения description
      description: Возвращает массив уникальных значений поля description по всем объектам коллекции.
      responses:
        '200':
          description: Уникальные значения
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/UniqueDescriptions'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EndpointNotFound'
        '502': *id001
        '503': *id002
        '504': *id003
  /killer/dragon/find-by-cave-depth/{max}:
    get:
      tags:
      - killer
      summary: Найти дракона по глубине пещеры
      description: Среди пещер с глубиной не более max находит дракона, живущего в самой глубокой (mode=deepest, по умолчанию) или самой мелкой (mode=shallowest) пещере.
      parameters:
      - name: max
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: mode
        in: query
        required: false
        schema:
          type: string
          enum:
          - deepest
          - shallowest
          default: deepest
      responses:
        '200':
          description: Найденный дракон
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Dragon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502': *id001
        '503': *id002
        '504': *id003
  /killer/teams/create/{team-id}/{team-name}/{team-size}/{start-cave-id}:
    post:
      tags:
      - killer
      summary: Создать команду убийц драконов
      description: Создаёт новую команду убийц драконов и сохраняет её в базе данных.
      parameters:
      - name: team-id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: true
          minimum: 0
      - name: team-name
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: team-size
        in: path
        required: true
        schema:
          type: integer
          format: int32
          exclusiveMinimum: true
          minimum: 0
      - name: start-cave-id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '201':
          description: Команда создана
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EndpointNotFound'
        '502': *id001
        '503': *id002
        '504': *id003
components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        exclusiveMinimum: true
        minimum: 0
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
    SortByParam:
      name: sortBy
      in: query
      required: false
      schema:
        type: string
        enum:
        - id
        - name
        - x
        - y
        - creationDate
        - age
        - description
        - weight
        - color
        - killerName
        - killerHeight
        - killerEyeColor
        - killerHairColor
    SortOrderParam:
      name: sortOrder
      in: query
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
    FilterId:
      name: id
      in: query
      required: false
      schema:
        type: integer
        format: int64
    FilterName:
      name: name
      in: query
      required: false
      schema:
        type: string
    FilterX:
      name: x
      in: query
      required: false
      schema:
        type: integer
        format: int32
    FilterY:
      name: y
      in: query
      required: false
      schema:
        type: integer
        format: int32
    FilterCreationDate:
      name: creationDate
      in: query
      required: false
      schema:
        type: string
        format: date
    FilterAge:
      name: age
      in: query
      required: false
      schema:
        type: integer
        format: int64
    FilterDescription:
      name: description
      in: query
      required: false
      schema:
        type: string
    FilterWeight:
      name: weight
      in: query
      required: false
      schema:
        type: integer
        format: int32
    FilterColor:
      name: color
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Color'
    FilterKillerName:
      name: killerName
      in: query
      required: false
      schema:
        type: string
    FilterKillerHeight:
      name: killerHeight
      in: query
      required: false
      schema:
        type: number
        format: double
    FilterKillerEyeColor:
      name: killerEyeColor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Color'
    FilterKillerHairColor:
      name: killerHairColor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Color'
  responses:
    BadRequest:
      description: 'Запрос не удалось разобрать: некорректный XML или неверный параметр в URL'
      content:
        application/xml:
          schema: &id006
            $ref: '#/components/schemas/Error'
          examples:
            malformedXml:
              summary: Некорректный XML
              value: |
                <?xml version="1.0" encoding="UTF-8"?>
                <error>
                  <code>400</code>
                  <message>Тело запроса не является корректным XML</message>
                </error>
            invalidParameter:
              summary: Некорректный параметр
              value: |
                <?xml version="1.0" encoding="UTF-8"?>
                <error>
                  <code>400</code>
                  <message>Параметр id должен быть положительным числом</message>
                </error>
    NotFound:
      description: Объект или URL не найдены
      content:
        application/xml:
          schema: &id004
            $ref: '#/components/schemas/Error'
          example: |
            <?xml version="1.0" encoding="UTF-8"?>
            <error>
              <code>404</code>
              <message>Объект не найден</message>
            </error>
        text/html: &id005
          schema:
            $ref: '#/components/schemas/NotFoundPage'
    ServiceUnavailable:
      description: Сервис временно недоступен (например, недоступна БД)
      content:
        application/xml:
          schema: *id004
          example: |
            <?xml version="1.0" encoding="UTF-8"?>
            <error>
              <code>503</code>
              <message>Нет соединения с базой данных</message>
            </error>
    BadGateway:
      description: 'Некорректный ответ от смежного сервиса: невалидные данные, неожиданный код ответа или обрыв соединения'
      content:
        application/xml:
          schema: *id004
          examples:
            invalidData:
              summary: Ответ получен, но данные невалидны
              value: |
                <?xml version="1.0" encoding="UTF-8"?>
                <error>
                  <code>502</code>
                  <message>Ответ смежного сервиса не является корректным XML</message>
                </error>
            unexpectedStatus:
              summary: Ответ получен, но код неожиданный
              value: |
                <?xml version="1.0" encoding="UTF-8"?>
                <error>
                  <code>502</code>
                  <message>Смежный сервис вернул неожиданный код ответа</message>
                </error>
            noResponse:
              summary: 'Ответ не получен: соединение отклонено или оборвано'
              value: |
                <?xml version="1.0" encoding="UTF-8"?>
                <error>
                  <code>502</code>
                  <message>Не удалось получить ответ от смежного сервиса</message>
                </error>
    GatewayTimeout:
      description: Смежный сервис не ответил за отведённое время
      content:
        application/xml:
          schema: *id004
          example: |
            <?xml version="1.0" encoding="UTF-8"?>
            <error>
              <code>504</code>
              <message>Смежный сервис не ответил за отведённое время</message>
            </error>
    EndpointNotFound:
      description: URL не найден
      content:
        text/html: *id005
    Forbidden:
      description: Доступ запрещён
      content:
        application/xml:
          schema: *id004
          example: |
            <?xml version="1.0" encoding="UTF-8"?>
            <error>
              <code>403</code>
              <message>Доступ запрещён</message>
            </error>
        text/html:
          schema:
            $ref: '#/components/schemas/ForbiddenPage'
    UnprocessableEntity:
      description: XML корректен, но данные нарушают ограничения целостности
      content:
        application/xml:
          schema: *id006
          examples:
            emptyName:
              summary: Пустое имя
              value: |
                <?xml version="1.0" encoding="UTF-8"?>
                <error>
                  <code>422</code>
                  <message>Поле name не может быть пустым</message>
                </error>
            invalidCoordinates:
              summary: Недопустимая координата
              value: |
                <?xml version="1.0" encoding="UTF-8"?>
                <error>
                  <code>422</code>
                  <message>Поле y не может быть больше 9</message>
                </error>
            invalidWeight:
              summary: Недопустимый вес
              value: |
                <?xml version="1.0" encoding="UTF-8"?>
                <error>
                  <code>422</code>
                  <message>Поле weight должно быть больше 0</message>
                </error>
    UnsupportedMediaType:
      description: Формат тела запроса не поддерживается, ожидается application/xml
      content:
        application/xml:
          schema: *id006
          example: |
            <?xml version="1.0" encoding="UTF-8"?>
            <error>
              <code>415</code>
              <message>Поддерживается только application/xml</message>
            </error>
  schemas:
    Color:
      type: string
      enum:
      - YELLOW
      - ORANGE
      - WHITE
      xml:
        name: color
    Coordinates:
      type: object
      required:
      - x
      - y
      properties:
        x:
          type: integer
          format: int32
          exclusiveMinimum: true
          minimum: -42
        y:
          type: integer
          format: int32
          maximum: 9
      xml:
        name: coordinates
    Person:
      type: object
      required:
      - name
      - height
      - eyeColor
      - hairColor
      properties:
        name:
          type: string
          minLength: 1
        height:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
        eyeColor:
          $ref: '#/components/schemas/Color'
        hairColor:
          $ref: '#/components/schemas/Color'
      xml:
        name: killer
    DragonInput:
      type: object
      required:
      - name
      - coordinates
      properties:
        name:
          type: string
          minLength: 1
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        age:
          type: integer
          format: int64
          exclusiveMinimum: true
          minimum: 0
          nullable: true
        description:
          type: string
          nullable: true
        weight:
          type: integer
          format: int32
          exclusiveMinimum: true
          minimum: 0
          nullable: true
        color:
          allOf:
          - $ref: '#/components/schemas/Color'
          nullable: true
        killer:
          allOf:
          - $ref: '#/components/schemas/Person'
          nullable: true
      xml:
        name: dragon
    Dragon:
      allOf:
      - type: object
        required:
        - id
        - creationDate
        properties:
          id:
            type: integer
            format: int64
            exclusiveMinimum: true
            minimum: 0
            readOnly: true
          creationDate:
            type: string
            format: date
            readOnly: true
      - $ref: '#/components/schemas/DragonInput'
      xml:
        name: dragon
    DragonArray:
      type: object
      properties:
        totalCount:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dragon'
          xml:
            name: dragon
            wrapped: true
      xml:
        name: dragons
    AverageAge:
      type: object
      properties:
        averageAge:
          type: number
          format: double
          nullable: true
      xml:
        name: averageAge
    UniqueDescriptions:
      type: object
      properties:
        values:
          type: array
          items:
            type: string
          xml:
            name: value
            wrapped: true
      xml:
        name: descriptions
    Team:
      type: object
      properties:
        teamId:
          type: integer
          format: int64
        teamName:
          type: string
        teamSize:
          type: integer
        startCaveId:
          type: integer
          format: int64
      xml:
        name: team
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP-код ответа (совпадает со статусом ответа)
        message:
          type: string
          description: Описание ошибки
      xml:
        name: error
    NotFoundPage:
      type: string
      description: HTML-страница веб-сервера для ненайденного URL
      example: <html><head><title>404 Not Found</title></head><body><h1>Not Found</h1></body></html>
    ForbiddenPage:
      type: string
      description: HTML-страница веб-сервера при запрете доступа
      example: <html><head><title>403 Forbidden</title></head><body><h1>Forbidden</h1></body></html>
servers:
- url: https://se.ifmo.ru/~s368856/soa1
  description: Helios